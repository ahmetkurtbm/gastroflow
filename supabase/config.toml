# Supabase CLI yapılandırması.
# project_id, bulut projesi oluşturulduktan sonra `supabase link` ile eşlenecek
# proje referansıdır (ör. "abcdefghijklmnop").
project_id = "gastroflow"

[db]
# Bulut projesiyle aynı ana sürüm olmalı, yoksa local'de geçen migration
# canlıda patlayabilir.
major_version = 17

[db.migrations]
schema_paths = []

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false          # Personel davetle eklenir, kendi kendine kayıt yok.
enable_confirmations = true
secure_password_change = true

# JWT'ye tenant_id / branch_id / app_role claim'lerini ekleyen hook.
# Bulut projesinde ayrıca Dashboard → Authentication → Hooks üzerinden
# etkinleştirilmesi gerekiyor.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
